[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-readonly-mcp"
version = "0.1.0"
description = "A read-only MCP server that lets AI agents browse DynamoDB and S3 with hard guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ravi Ganti" }]
keywords = ["mcp", "aws", "dynamodb", "s3", "ai-agents", "read-only", "audit"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
dependencies = ["mcp>=2,<3", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "moto[dynamodb,s3]"]

[project.scripts]
aws-readonly-mcp = "aws_readonly_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_readonly_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
